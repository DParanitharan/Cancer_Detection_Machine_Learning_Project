[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-detection"
version = "0.1.0"
description = "Leakage-safe classification of cancer from cfDNA fragment-length profiles (IT1244 Team 22)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<2.3",
    "scipy>=1.10,<1.14",
    "scikit-learn>=1.3,<1.6",
    "imbalanced-learn>=0.11,<0.13",
    "matplotlib>=3.7,<3.10",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
